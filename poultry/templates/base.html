<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Poultry Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>POULTRY TRACKER</h1>
    <nav>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if active_nav == 'dashboard' else '' }}">Dashboard</a>
      <a href="{{ url_for('list_batches') }}" class="{{ 'active' if active_nav == 'batches' else '' }}">Batches</a>
      <a href="{{ url_for('harvest_planner') }}" class="{{ 'active' if active_nav == 'harvest' else '' }}">Harvest Planner</a>
      <a href="{{ url_for('list_manpower') }}" class="{{ 'active' if active_nav == 'manpower' else '' }}">Manpower</a>
      <a href="{{ url_for('list_utilities') }}" class="{{ 'active' if active_nav == 'utilities' else '' }}">Utilities</a>
    </nav>
  </aside>
  <main class="main">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
