{% extends "base.html" %}
{% block title %}Harvest · {{ batch.batch_code }}{% endblock %}
{% block content %}
<h2>Record Harvest · {{ batch.batch_code }}</h2>
<form method="post">
  <div class="grid">
    <div class="field">
      <label>Harvest Date</label>
      <input name="harvest_date" type="date" value="{{ today }}" required>
    </div>
    <div class="field">
      <label>Birds Harvested</label>
      <input name="birds_harvested" type="number" min="1" required>
    </div>
    <div class="field">
      <label>Total Live Weight (kg)</label>
      <input name="total_weight_kg" type="number" step="0.1" min="0" required>
    </div>
  </div>
  <div class="field">
    <label>Notes</label>
    <textarea name="notes" placeholder="Buyer, truck #, condemnations, etc."></textarea>
  </div>
  <div class="row">
    <button>Record Harvest</button>
    <a class="btn secondary" href="{{ url_for('batch_detail', batch_id=batch.id) }}">Cancel</a>
  </div>
</form>
{% endblock %}
